---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan1-ipblock
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan1-ipblock",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "capabilities": {"ips": true },
                    "ipam":{
                      "type":"static"
                    }
                }]
        }'
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-ipblock-ipv6
---
# Pods
apiVersion: v1
kind: Pod
metadata:
  name: pod-server
  namespace: test-ipblock-ipv6
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{
      "name": "macvlan1-ipblock",
      "namespace": "default",
      "ips": ["2001::1/64"]
      }]'
  labels:
    app: test-ipblock-ipv6
    name: pod-server
spec:
  containers:
    - name: macvlan-worker1
      image: localhost:5000/multus-networkpolicy-nftables-tests:e2e
      command: ["nc", "-klp", "5555"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-a
  namespace: test-ipblock-ipv6
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{
      "name": "macvlan1-ipblock",
      "namespace": "default",
      "ips": ["2001::2/64"]
      }]'
  labels:
    app: test-ipblock-ipv6
    name: pod-client-a
spec:
  containers:
    - name: macvlan-worker1
      image: localhost:5000/multus-networkpolicy-nftables-tests:e2e
      command: ["nc", "-klp", "5555"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-b
  namespace: test-ipblock-ipv6
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{
      "name": "macvlan1-ipblock",
      "namespace": "default",
      "ips": ["2001::3/64"]
      }]'
  labels:
    app: test-ipblock-ipv6
    name: pod-client-b
spec:
  containers:
    - name: macvlan-worker1
      image: localhost:5000/multus-networkpolicy-nftables-tests:e2e
      command: ["nc", "-klp", "5555"]
      securityContext:
        privileged: true
---
# MultiNetworkPolicies
# this policy accepts ingress trafic from pod-client-a to pod-server
# and ingress trafic from pod-client-b to pod-server
# as a result, these policies accepts ingress traffic from pod-client-a
# or from pod-client-b, to pod-server.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: testnetwork-policy-ipblock-1
  namespace: test-ipblock-ipv6
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan1-ipblock
spec:
  podSelector:
    matchLabels:
      name: pod-server
  egress:
  - ports:
    - port: 5555
      protocol: TCP
    to:
    - ipBlock:
        cidr: 2001::3/128
      podSelector:
        matchLabels:
          name: pod-client-b
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: pod-client-a
    ports:
    - port: 5555
      protocol: TCP
  policyTypes:
  - Ingress
  - Egress
